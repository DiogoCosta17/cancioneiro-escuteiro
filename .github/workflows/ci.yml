name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # O build vem antes dos testes: alguns testes verificam o service worker gerado (dist/sw.js).
      # `npm run build` já inclui a verificação de tipos (tsc -b).
      - name: Build
        run: npm run build

      - name: Tests
        run: npx vitest run
